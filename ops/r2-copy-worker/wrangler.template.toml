# TEMPORARY Worker for the r2-apac-copy job of .github/workflows/ops.yml.
#
# This is the template. The job renders it for ONE client into wrangler.toml
# (gitignored, never committed): the account, this Worker's name (the client's
# Worker name + "-r2-copy") and the two buckets are that client's own, taken from
# its rendered Worker config and the run's OPS_R2_SOURCE_BUCKET. The job checks
# the rendered file against them before it deploys anything.
#
# The job deploys it, drives it page by page from the runner, and DELETES it
# at the end of every run -- including a failed or cancelled one. It is not
# part of the production Worker (cloudflare/wrangler.toml) and has no routes,
# crons, queues or observability: it is reachable only on workers.dev, and
# every request needs the bearer secret COPY_TOKEN, which the runner
# generates per run and sets with `wrangler secret put` (never echoed).
# Without that secret every request is refused with 503.
#
# SOURCE is only ever used through a read-only wrapper (head/get/list): the
# Worker cannot write or delete anything in the source bucket.
name = "{{COPY_WORKER}}"
main = "src/index.mjs"
compatibility_date = "2026-07-01"
account_id = "{{ACCOUNT_ID}}"
workers_dev = true
preview_urls = false

[[r2_buckets]]
binding = "SOURCE"
bucket_name = "{{SOURCE_BUCKET}}"

[[r2_buckets]]
binding = "DESTINATION"
bucket_name = "{{DEST_BUCKET}}"
