<!doctype html><html><head><meta charset='utf-8'><style>
*{box-sizing:border-box} @page{size:80mm 240mm;margin:0}
html,body{margin:0!important;padding:0!important;width:80mm!important;min-width:80mm!important;max-width:80mm!important;height:240mm!important;min-height:240mm!important;background:white;overflow:visible!important}
.receipt{width:80mm;min-width:80mm;max-width:80mm;padding:4mm 4mm 4mm 4mm;margin:0;box-sizing:border-box;break-inside:avoid-page;page-break-inside:avoid}
.inner{width:100%;max-width:100%;min-width:0;margin:0;overflow-wrap:anywhere}
.row{border-bottom:1px dashed #aaa;padding:2mm 0;font:12px sans-serif}
</style></head><body><div class='receipt'><div class='inner'>
<div class='row'>LEFT EDGE — 80 mm thermal receipt probe</div>
<script>for(let i=1;i<=42;i++)document.write(`<div class="row">Item ${i} — Khmer/English data — $${(i*1.25).toFixed(2)}</div>`)</script>
<div class='row'>RIGHT EDGE — END</div>
</div></div></body></html>
