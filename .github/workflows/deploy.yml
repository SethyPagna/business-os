# Deploy Business OS to production from GitHub, so a release does not depend
# on the owner's own network (a VPN exit that Cloudflare challenges).
#
# Runs ONLY when someone presses "Run workflow" (no push or pull request
# trigger), waits for the `production` environment's required reviewer, and
# refuses to start unless the confirm box says DEPLOY, compared ordinally
# (byte for byte: no soft hyphen, zero-width or look-alike letter passes).
#
# This repository is public, so its Actions logs are public too. The job
# summary carries row COUNTS, restore-point bookmarks and commit ids only:
# never row data, names, customers or amounts. Output of the commands that
# read production is kept out of the log (release.cjs -CI).
#
# Setup, click by click: docs/setup/release-setup-guide.md.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to release
        required: true
        default: claude/urgent-20260925
        type: string
      plan:
        description: Cloudflare plan config (production runs paid)
        required: true
        default: paid
        type: choice
        options:
          - paid
          - free
      run_migrations:
        description: Apply waiting database updates before publishing
        required: true
        default: true
        type: boolean
      confirm:
        description: Type DEPLOY to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Release to production
    runs-on: windows-latest
    environment: production
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check the confirm word
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if (-not [string]::Equals($env:CONFIRM, 'DEPLOY', [System.StringComparison]::Ordinal)) {
            Write-Output '::error::Type DEPLOY (in capitals) in the confirm box to release.'
            exit 1
          }

      - name: Initialize release record paths
        run: |
          if ($env:GITHUB_RUN_ID -notmatch '\A[1-9][0-9]*\z' -or $env:GITHUB_RUN_ATTEMPT -notmatch '\A[1-9][0-9]*\z') {
            throw 'Invalid release record identity.'
          }
          foreach ($value in @($env:RUNNER_TEMP, $env:GITHUB_ENV)) {
            if ([string]::IsNullOrWhiteSpace($value) -or $value -match '[\r\n]' -or -not [System.IO.Path]::IsPathFullyQualified($value)) {
              throw 'Invalid release record environment.'
            }
          }
          @(
            "RELEASE_RECORDS_ROOT=$(Join-Path $env:RUNNER_TEMP "records-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")"
            "RELEASE_RECORDS_OUTPUT=$(Join-Path $env:RUNNER_TEMP "release-records-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.enc.json")"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Check out the release kit
        uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ops/scripts/deploy-kit/
            /ops/scripts/ops-crypto.mjs
            /ops/keys/ops-export-public.pem

      - name: Check out the commit to release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: release
          persist-credentials: false
          # Full history: some safety tests compare against an older version of a
          # file with `git show <old commit>:<path>`, which a shallow clone lacks.
          fetch-depth: 0

      - name: Show the commit
        working-directory: release
        run: |
          $sha = git rev-parse HEAD
          $subject = git log -1 --format=%s
          Write-Output "Releasing $sha  $subject"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # frontend/package.json engines: node >= 24 (cloudflare needs >= 22).
          node-version: 24
          cache: npm
          cache-dependency-path: |
            release/frontend/package-lock.json
            release/cloudflare/package-lock.json

      - name: Verify encrypted record protection
        id: records_precheck
        run: |
          $releaseSha = git -C release rev-parse HEAD
          $kitSha = git -C kit rev-parse HEAD
          node kit/ops/scripts/deploy-kit/export-records.mjs precheck --key kit/ops/keys/ops-export-public.pem --records "$env:RELEASE_RECORDS_ROOT" --output "$env:RELEASE_RECORDS_OUTPUT" --run-id "$env:GITHUB_RUN_ID" --attempt "$env:GITHUB_RUN_ATTEMPT" --commit "$releaseSha" --kit-commit "$kitSha"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$releaseSha" >> $env:GITHUB_OUTPUT
          "kit_commit=$kitSha" >> $env:GITHUB_OUTPUT

      - name: Install packages (cloudflare)
        working-directory: release/cloudflare
        run: npm ci --no-audit --no-fund

      - name: Install packages (frontend)
        working-directory: release/frontend
        run: npm ci --no-audit --no-fund

      # The service-worker safety tests drive a real Chromium.
      - name: Install the test browser (frontend)
        working-directory: release/frontend
        run: npx playwright install chromium

      - name: Record the release
        id: record_release
        run: node kit/ops/scripts/deploy-kit/release.cjs prepare -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT"

      # The tests run the released commit's own code, so no Cloudflare secret
      # is given to this step.
      - name: Safety tests (every test file on its own, retried on timeout)
        run: node kit/ops/scripts/deploy-kit/release.cjs gates -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT" -Jobs 2

      - name: Safety snapshot (restore point and row counts)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: node kit/ops/scripts/deploy-kit/release.cjs snapshot -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT"

      - name: Database updates (migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          $kitArgs = @('migrations', '-CI', '-ReleaseDir', 'release', '-Records', "$env:RELEASE_RECORDS_ROOT")
          if ($env:RUN_MIGRATIONS -ne 'true') { $kitArgs += '-NoApply' }
          node kit/ops/scripts/deploy-kit/release.cjs @kitArgs

      - name: Publish (deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          PLAN: ${{ inputs.plan }}
        run: node kit/ops/scripts/deploy-kit/release.cjs deploy -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT" -Plan $env:PLAN

      - name: Live checks and row counts after
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          PLAN: ${{ inputs.plan }}
        run: node kit/ops/scripts/deploy-kit/release.cjs live -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT" -Plan $env:PLAN

      - name: Preserve release evidence and history
        if: always()
        run: |
          @(
            '### Release recovery guidance'
            ''
            'Retain the encrypted release records and record the exact run and release commit.'
            'If a release is partial or its outcome is uncertain, stop and reconcile the live Worker, migration ledger and installed guards before any retry.'
            'Preserve business history. Recovery requires reviewed compensating records; do not restore a database snapshot, delete history, remove fences or rerun the cutover.'
            'The release publisher must review the evidence and authorize any recovery action.'
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Encrypt release records
        id: export_records
        if: always() && steps.records_precheck.outcome == 'success' && steps.record_release.outcome != 'skipped' && steps.record_release.outcome != ''
        env:
          RELEASE_RECORDS_COMMIT: ${{ steps.records_precheck.outputs.commit }}
          RELEASE_RECORDS_KIT_COMMIT: ${{ steps.records_precheck.outputs.kit_commit }}
        run: node kit/ops/scripts/deploy-kit/export-records.mjs export --key kit/ops/keys/ops-export-public.pem --records "$env:RELEASE_RECORDS_ROOT" --output "$env:RELEASE_RECORDS_OUTPUT" --run-id "$env:GITHUB_RUN_ID" --attempt "$env:GITHUB_RUN_ATTEMPT" --commit "$env:RELEASE_RECORDS_COMMIT" --kit-commit "$env:RELEASE_RECORDS_KIT_COMMIT"

      - name: Retain encrypted release records
        if: always() && steps.export_records.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-release-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_RECORDS_OUTPUT }}
          if-no-files-found: error
          retention-days: 3
