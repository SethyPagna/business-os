# Deploy Business OS to production from GitHub, so a release does not depend
# on the owner's own network (a VPN exit that Cloudflare challenges).
#
# Runs ONLY when someone presses "Run workflow" (no push or pull request
# trigger), waits for the `production` environment's required reviewer, and
# refuses to start unless the confirm box says DEPLOY, compared ordinally
# (byte for byte: no soft hyphen, zero-width or look-alike letter passes).
#
# This repository is public, so its Actions logs are public too. The job
# summary carries row COUNTS, restore-point bookmarks and commit ids only:
# never row data, names, customers or amounts. Output of the commands that
# read production is kept out of the log (release.cjs -CI).
#
# Setup, click by click: docs/setup/release-setup-guide.md.
#
# Gate reuse (input gate_run_id): the full test sweep is the slow part, and the
# Gate workflow already runs it, sharded, on the same kind of runner. When a Gate
# run id is given, this workflow does not repeat the sweep. The separate job
# `gate_check` (the only one with `actions: read`) proves, through the GitHub API,
# that the run is gate.yml of this repository, finished with every job green (browser
# suite included), tested exactly this full commit id, ran with a compatible release
# kit and is at most MAX_GATE_AGE_HOURS old (ops/scripts/deploy-kit/gate-reuse.cjs,
# pinned by cloudflare/scripts/test-deploy-gate-reuse-pure.cjs). The deploy job then
# repeats the offline part of that decision at deploy time (the age keeps counting
# while the reviewer decides), builds the app and refuses unless the build has the
# digest the gate's shards tested. The publish step checks that digest once more
# immediately before the upload and never builds on this path. Any failed check stops
# the deploy; there is no weaker fallback. With the input empty, `gate_check` is
# skipped and the full sweep runs here exactly as before.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to release
        required: true
        default: claude/urgent-20260925
        type: string
      plan:
        description: Cloudflare plan config (production runs paid)
        required: true
        default: paid
        type: choice
        options:
          - paid
          - free
      run_migrations:
        description: Apply waiting database updates before publishing
        required: true
        default: true
        type: boolean
      gate_run_id:
        description: Optional. Id of a finished green Gate run for exactly this full commit id; skips the repeat test sweep (empty = run the full sweep here)
        required: false
        default: ''
        type: string
      confirm:
        description: Type DEPLOY to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Release to production
    needs: gate_check
    if: ${{ !cancelled() && (needs.gate_check.result == 'success' || (inputs.gate_run_id == '' && needs.gate_check.result == 'skipped')) }}
    runs-on: windows-latest
    environment: production
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check the confirm word
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if (-not [string]::Equals($env:CONFIRM, 'DEPLOY', [System.StringComparison]::Ordinal)) {
            Write-Output '::error::Type DEPLOY (in capitals) in the confirm box to release.'
            exit 1
          }

      - name: Initialize release record paths
        run: |
          if ($env:GITHUB_RUN_ID -notmatch '\A[1-9][0-9]*\z' -or $env:GITHUB_RUN_ATTEMPT -notmatch '\A[1-9][0-9]*\z') {
            throw 'Invalid release record identity.'
          }
          foreach ($value in @($env:RUNNER_TEMP, $env:GITHUB_ENV)) {
            if ([string]::IsNullOrWhiteSpace($value) -or $value -match '[\r\n]' -or -not [System.IO.Path]::IsPathFullyQualified($value)) {
              throw 'Invalid release record environment.'
            }
          }
          @(
            "RELEASE_RECORDS_ROOT=$(Join-Path $env:RUNNER_TEMP "records-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")"
            "RELEASE_RECORDS_OUTPUT=$(Join-Path $env:RUNNER_TEMP "release-records-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.enc.json")"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Check out the release kit
        uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ops/scripts/deploy-kit/
            /ops/scripts/ops-crypto.mjs
            /ops/keys/ops-export-public.pem

      - name: Check out the commit to release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: release
          persist-credentials: false
          # Full history: some safety tests compare against an older version of a
          # file with `git show <old commit>:<path>`, which a shallow clone lacks.
          fetch-depth: 0

      - name: Show the commit
        working-directory: release
        run: |
          $sha = git rev-parse HEAD
          $subject = git log -1 --format=%s
          Write-Output "Releasing $sha  $subject"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # frontend/package.json engines: node >= 24 (cloudflare needs >= 22).
          node-version: 24
          cache: npm
          cache-dependency-path: |
            release/frontend/package-lock.json
            release/cloudflare/package-lock.json

      - name: Download the gate evidence
        if: ${{ inputs.gate_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: gate-reuse-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-check

      # Offline, so it can run again here: the run's age keeps counting while the
      # reviewer decides, and this job's own checkout is compared with the gate's.
      - name: Check the gate verdict at deploy time
        if: ${{ inputs.gate_run_id != '' }}
        run: |
          node kit/ops/scripts/deploy-kit/gate-reuse.cjs decide --collected "$env:RUNNER_TEMP/gate-check/gate-collected.json" --verdict "$env:RUNNER_TEMP/gate-check/verdict/gate-verdict.json" --release release
          exit $LASTEXITCODE

      - name: Verify encrypted record protection
        id: records_precheck
        run: |
          $releaseSha = git -C release rev-parse HEAD
          $kitSha = git -C kit rev-parse HEAD
          node kit/ops/scripts/deploy-kit/export-records.mjs precheck --key kit/ops/keys/ops-export-public.pem --records "$env:RELEASE_RECORDS_ROOT" --output "$env:RELEASE_RECORDS_OUTPUT" --run-id "$env:GITHUB_RUN_ID" --attempt "$env:GITHUB_RUN_ATTEMPT" --commit "$releaseSha" --kit-commit "$kitSha"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$releaseSha" >> $env:GITHUB_OUTPUT
          "kit_commit=$kitSha" >> $env:GITHUB_OUTPUT

      - name: Install packages (cloudflare)
        working-directory: release/cloudflare
        run: npm ci --no-audit --no-fund

      - name: Install packages (frontend)
        working-directory: release/frontend
        run: npm ci --no-audit --no-fund

      # The service-worker safety tests drive a real Chromium.
      - name: Install the test browser (frontend)
        if: ${{ inputs.gate_run_id == '' }}
        working-directory: release/frontend
        run: npx playwright install chromium

      - name: Record the release
        id: record_release
        run: node kit/ops/scripts/deploy-kit/release.cjs prepare -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT"

      - name: Keep the gate verdict with the release records
        if: ${{ inputs.gate_run_id != '' }}
        run: |
          node kit/ops/scripts/deploy-kit/gate-reuse.cjs evidence --collected "$env:RUNNER_TEMP/gate-check/gate-collected.json" --verdict "$env:RUNNER_TEMP/gate-check/verdict/gate-verdict.json" --out "$env:RELEASE_RECORDS_ROOT/gate-reuse"
          exit $LASTEXITCODE

      - name: Keep the gate test logs with the release records
        if: ${{ inputs.gate_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: gate-reuse-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_RECORDS_ROOT }}/gate-reuse/gate-records

      # The gate run proved the tests for this exact commit. The build is still
      # made here, without a Cloudflare secret, because it is what gets published.
      # The kit pins its build id to the commit, so it can match the tested build.
      - name: Build the app (the gate run proved its tests)
        if: ${{ inputs.gate_run_id != '' }}
        run: node kit/ops/scripts/deploy-kit/release.cjs gates -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT" -Part build

      - name: Check the built app is the app the gate tested
        if: ${{ inputs.gate_run_id != '' }}
        run: |
          node kit/ops/scripts/deploy-kit/gate-reuse.cjs verify-dist --dist release/frontend/dist --verdict "$env:RUNNER_TEMP/gate-check/verdict/gate-verdict.json"
          exit $LASTEXITCODE

      # From here the publish step (release.cjs deploy) compares frontend/dist with this
      # verdict immediately before the upload, and refuses to build the app itself.
      - name: Pin the tested app for the publish step
        if: ${{ inputs.gate_run_id != '' }}
        run: |
          "RELEASE_EXPECT_DIST=$env:RUNNER_TEMP/gate-check/verdict/gate-verdict.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The tests run the released commit's own code, so no Cloudflare secret
      # is given to this step.
      - name: Safety tests (every test file on its own, retried on timeout)
        if: ${{ inputs.gate_run_id == '' }}
        run: node kit/ops/scripts/deploy-kit/release.cjs gates -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT" -Jobs 2

      - name: Safety snapshot (restore point and row counts)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: node kit/ops/scripts/deploy-kit/release.cjs snapshot -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT"

      - name: Database updates (migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          $kitArgs = @('migrations', '-CI', '-ReleaseDir', 'release', '-Records', "$env:RELEASE_RECORDS_ROOT")
          if ($env:RUN_MIGRATIONS -ne 'true') { $kitArgs += '-NoApply' }
          node kit/ops/scripts/deploy-kit/release.cjs @kitArgs

      - name: Publish (deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          PLAN: ${{ inputs.plan }}
        run: node kit/ops/scripts/deploy-kit/release.cjs deploy -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT" -Plan $env:PLAN

      - name: Live checks and row counts after
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          PLAN: ${{ inputs.plan }}
        run: node kit/ops/scripts/deploy-kit/release.cjs live -CI -ReleaseDir release -Records "$env:RELEASE_RECORDS_ROOT" -Plan $env:PLAN

      - name: Preserve release evidence and history
        if: always()
        run: |
          @(
            '### Release recovery guidance'
            ''
            'Retain the encrypted release records and record the exact run and release commit.'
            'If a release is partial or its outcome is uncertain, stop and reconcile the live Worker, migration ledger and installed guards before any retry.'
            'Preserve business history. Recovery requires reviewed compensating records; do not restore a database snapshot, delete history, remove fences or rerun the cutover.'
            'The release publisher must review the evidence and authorize any recovery action.'
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Encrypt release records
        id: export_records
        if: always() && steps.records_precheck.outcome == 'success' && steps.record_release.outcome != 'skipped' && steps.record_release.outcome != ''
        env:
          RELEASE_RECORDS_COMMIT: ${{ steps.records_precheck.outputs.commit }}
          RELEASE_RECORDS_KIT_COMMIT: ${{ steps.records_precheck.outputs.kit_commit }}
        run: node kit/ops/scripts/deploy-kit/export-records.mjs export --key kit/ops/keys/ops-export-public.pem --records "$env:RELEASE_RECORDS_ROOT" --output "$env:RELEASE_RECORDS_OUTPUT" --run-id "$env:GITHUB_RUN_ID" --attempt "$env:GITHUB_RUN_ATTEMPT" --commit "$env:RELEASE_RECORDS_COMMIT" --kit-commit "$env:RELEASE_RECORDS_KIT_COMMIT"

      - name: Retain encrypted release records
        if: always() && steps.export_records.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-release-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_RECORDS_OUTPUT }}
          if-no-files-found: error
          retention-days: 3

  # Runs only with gate_run_id, before the production reviewer is asked. The only job
  # that can read Actions data (other runs' jobs and artifacts); it has no secret.
  gate_check:
    name: Check the gate run to reuse
    if: ${{ inputs.gate_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the release kit
        uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ops/scripts/deploy-kit/

      - name: Check out the commit to release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: release
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the gate run to reuse
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_RUN_ID: ${{ inputs.gate_run_id }}
          DEPLOY_REF: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node kit/ops/scripts/deploy-kit/gate-reuse.cjs collect --repo "$env:REPOSITORY" --run-id "$env:GATE_RUN_ID" --deploy-ref "$env:DEPLOY_REF" --release release --kit kit --out "$env:RUNNER_TEMP/gate-evidence/gate-collected.json"
          exit $LASTEXITCODE

      - name: Download the gate verdict
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.collect.outputs.verdict_artifact }}
          run-id: ${{ inputs.gate_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gate-evidence/verdict

      - name: Download the gate test logs
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.collect.outputs.records_artifact }}
          run-id: ${{ inputs.gate_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gate-logs

      - name: Check the gate verdict
        run: |
          node kit/ops/scripts/deploy-kit/gate-reuse.cjs decide --collected "$env:RUNNER_TEMP/gate-evidence/gate-collected.json" --verdict "$env:RUNNER_TEMP/gate-evidence/verdict/gate-verdict.json" --release release
          exit $LASTEXITCODE

      - name: Hand the gate evidence to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: gate-reuse-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-evidence
          retention-days: 3
          if-no-files-found: error

      - name: Hand the gate test logs to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: gate-reuse-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-logs
          retention-days: 3
          if-no-files-found: error
