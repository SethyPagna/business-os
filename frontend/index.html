<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The storefront can be pinch-zoomed (owner, 27 Sep 2026; WCAG 1.4.4),
         so the static viewport below carries no zoom cap. The staff app and
         the till keep the lock: the bootstrap script writes it into this meta
         on every admin route, so browser pinch-zoom cannot scale the whole UI
         and push action rows outside the viewport. The image lightbox has its
         own explicit zoom controls.

         maximum-scale/user-scalable are belt and braces, NOT the primary
         defence against focus-zoom: Safari has ignored user-scalable on the
         open web since iOS 10 and honours it only in an installed home-screen
         PWA. The mechanism that actually stops a tapped field from zooming
         the page is the 16px font-size floor at the end of
         src/styles/main.css -- keep that rule, not this attribute, in mind
         when a field starts zooming again. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Browse Business OS products and contact the store." />
    <!-- This file names no client. One build serves every deployment, and the
         Worker writes the deployment's own identity (wrangler [vars], see
         cloudflare/src/lib/clientIdentity.ts) into the title, description,
         icons, Open Graph tags, canonical URL, the identity block below and
         the loading shell of every app document it serves
         (cloudflare/src/lib/documentIdentity.ts). What is written here is the
         neutral Business OS identity, which only a document the Worker never
         saw shows: the Vite dev server, or an unknown path the asset layer
         answers on its own.

         Canonical URL and link previews (Open Graph / Twitter card) for the
         storefront: the Worker writes ABSOLUTE values naming the configured
         public host, for two reasons: crawlers do not resolve relative URLs,
         and any alias host that ever serves this very same document (www., a
         preview URL) is folded into the primary one without any per-host
         work at all.

         The storefront's indexable URLs are the home page and the three
         query-addressed legal readers (?legal=privacy|terms|cookies, which the
         sitemap lists). Those readers are VIEWS of this one document -- the
         raw HTML a crawler receives is byte-identical -- so they share its
         canonical. If a policy ever becomes its own document, the canonical
         has to become per-URL, and that means a Worker rewrite.

         On admin hosts the Worker writes RELATIVE values instead, on purpose:
         nothing should ever preview or index the admin app, and the point
         there is only that it is not the storefront. The inline bootstrap
         below leaves all of these alone. -->
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Business OS" />
    <meta property="og:title" content="Business OS" />
    <meta property="og:description" content="Browse Business OS products and contact the store." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, not `black-translucent`. black-translucent paints the iOS
         status bar text WHITE and lets the page run underneath it, which only
         works over dark top chrome. Both hosts are near-white in the
         light-first default this app ships: the storefront ground is #ffffff
         (PORTAL_LIGHT_SURFACE) and the admin's mobile top bar is the ivory
         --nav-surface #fffdf8 (src/components/navigation/nav-chrome.css), the
         two values the theme-color meta above carries per host. One static
         value, not a per-host swap: both hosts want the same answer. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Business OS" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Public-first metadata is intentional. iOS may snapshot the raw HTML
         before JavaScript runs, so the customer domain must never initially
         advertise the staff app. The synchronous bootstrap below swaps these
         to the staff identity on admin.* / localhost. -->
    <link rel="manifest" href="/portal-manifest.json" />
    <link rel="icon" type="image/x-icon" href="/admin-favicon-v1.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/admin-apple-touch-icon-v1.png" />
    <title>Business OS</title>
    <!-- The deployment's identity, rewritten by the Worker; read by the
         bootstrap below and by src/app/clientIdentity.ts. -->
    <script id="business-os-identity" type="application/json">{"shopName":"Business OS","shopNameKm":"Business OS","shopAlias":"","shopNames":"Business OS","shopCategory":"","shopDescription":"Browse Business OS products and contact the store.","adminTitle":"Business OS Admin","adminShortName":"Business OS Admin","adminDescription":"Till, stock and sales for Business OS staff","organizationName":"Business OS","membershipPrefix":"M-","staffHost":"","shopIcons":{"favicon":"/admin-favicon-v1.ico","icon192":"/icon-192.png","icon512":"/icon-512.png","maskable192":"/icon-192-maskable-v2.png","maskable512":"/icon-512-maskable-v2.png","appleTouch":"/admin-apple-touch-icon-v1.png"}}</script>
    <script>
      (function setInitialBusinessOsRoute() {
        var pathname = String(window.location && window.location.pathname || '/')
          .split('?')[0]
          .split('#')[0]
          .replace(/\/{2,}/g, '/')
          .replace(/\/+$/g, '')
          .toLowerCase() || '/'
        // MUST list every segment src/app/pathRouting.ts routes to the admin
        // app -- ADMIN_ROUTE_PAGE_BY_SEGMENT plus ADMIN_AUTH_ROUTE_SEGMENTS. A
        // missing segment renders that admin page without the
        // machine-translation opt-out below, on the very pages that crash
        // under it. tests/posCommittedCloseDurability.test.ts drives this
        // table from pathRouting.ts's own maps.
        var adminRoutes = {
          '/': true,
          '/admin': true,
          '/app': true,
          '/login': true,
          '/dashboard': true,
          '/notes': true,
          '/products': true,
          '/product': true,
          '/pos': true,
          '/point-of-sale': true,
          '/inventory': true,
          '/sales': true,
          '/returns': true,
          '/fees': true,
          '/branches': true,
          '/contacts': true,
          '/delivery-contacts': true,
          '/catalog': true,
          '/loyalty-points': true,
          '/loyalty': true,
          '/promotions': true,
          '/promos': true,
          '/users': true,
          '/review': true,
          '/review-queue': true,
          '/audit-log': true,
          '/audit': true,
          '/receipt-settings': true,
          '/receipts': true,
          '/backup': true,
          '/backups': true,
          '/settings': true,
          '/files': true,
          '/library': true,
          '/server': true
        }
        var hostname = String(window.location && window.location.hostname || '').toLowerCase()
        // A www. alias VISIT redirects to the bare host. Only page
        // navigations go through this bootstrap -- API/upload fetches never
        // load index.html -- so existing integrations keep working while
        // people (and bookmarks/PWA opens) land on the canonical host with
        // their path and query preserved. try/catch keeps the test DOM
        // doubles (no location.replace) and any exotic browser on the normal
        // render path instead of a blank page.
        if (hostname.indexOf('www.') === 0) {
          try {
            window.location.replace('https://' + hostname.slice(4) + window.location.pathname + window.location.search + window.location.hash)
          } catch (redirectError) { /* fall through to normal render */ }
        }
        // The deployment's identity, written by the Worker. Its staffHost is
        // the configured staff host (a workers.dev client's <client>-admin.<subdomain>.workers.dev),
        // a staff host as admin.* and loopback are (src/app/clientIdentity.ts
        // isStaffHostname).
        var identity = {}
        try {
          identity = JSON.parse(document.getElementById('business-os-identity').textContent) || {}
        } catch (identityError) { /* the served head stays as it is */ }
        var staffHost = typeof identity.staffHost === 'string' ? identity.staffHost.toLowerCase() : ''
        var adminHostname = hostname === 'localhost'
          || hostname === '127.0.0.1'
          || hostname === '[::1]'
          || hostname === '::1'
          || hostname.indexOf('admin.') === 0
          || (staffHost !== '' && hostname === staffHost)
        var segment = '/' + (pathname.split('/').filter(Boolean)[0] || '')
        // Owner, 27 Sep 2026: the public site never shows admin -- on a shop
        // host every document is the storefront (src/app/pathRouting.ts).
        var documentRoute = pathname !== '/health'
          && pathname.indexOf('/api/') !== 0
          && pathname.indexOf('/uploads/') !== 0
        var publicRoute = !adminHostname
          ? documentRoute
          : pathname !== '/'
            && documentRoute
            && !/\.[a-z0-9]+$/i.test(pathname)
            && !adminRoutes[segment]
        document.documentElement.setAttribute('data-business-os-initial-route', publicRoute ? 'public' : 'admin')
        // The storefront opens in Khmer by default (P-public-1, Sep 25 2026),
        // so declare km before any script or crawler reads the static
        // lang="en". PublicCatalogPage re-sets it on mount to the visitor's
        // chosen language. Admin routes leave lang alone -- AppContext sets
        // the staff member's own language.
        if (publicRoute) {
          document.documentElement.setAttribute('lang', 'km')
        }
        // What installs follows the HOST, what renders follows the route: an
        // unknown path on admin.* renders the storefront but must never
        // install as the shop. The names and the shop's icons come from the
        // identity block above; a value it lacks leaves the served tag alone.
        var brand = adminHostname
          ? {
            title: identity.adminTitle,
            appTitle: identity.adminShortName,
            description: identity.adminDescription,
            themeColor: '#fffdf8',
            manifest: '/manifest.json',
            icons: { favicon: '/admin-favicon-v1.ico', icon192: '/icon-192.png', icon512: '/icon-512.png', appleTouch: '/admin-apple-touch-icon-v1.png' }
          }
          : {
            title: identity.shopName,
            appTitle: identity.shopName,
            description: identity.shopDescription,
            themeColor: '#ffffff',
            manifest: '/portal-manifest.json',
            icons: identity.shopIcons || {}
          }
        function setHeadAttribute(selector, name, value) {
          var element = document.querySelector(selector)
          if (element && value) element.setAttribute(name, value)
        }
        if (brand.title) document.title = brand.title
        setHeadAttribute('meta[name="apple-mobile-web-app-title"]', 'content', brand.appTitle)
        setHeadAttribute('meta[name="description"]', 'content', brand.description)
        setHeadAttribute('meta[name="theme-color"]', 'content', brand.themeColor)
        setHeadAttribute('link[rel="manifest"]', 'href', brand.manifest)
        setHeadAttribute('link[rel="apple-touch-icon"]', 'href', brand.icons.appleTouch)
        var iconLinks = document.querySelectorAll('link[rel="icon"]')
        for (var iconIndex = 0; iconIndex < iconLinks.length; iconIndex += 1) {
          var iconSize = iconLinks[iconIndex].getAttribute('sizes')
          var iconHref = iconSize === '192x192' ? brand.icons.icon192 : (iconSize === '512x512' ? brand.icons.icon512 : brand.icons.favicon)
          if (!iconHref) continue
          iconLinks[iconIndex].setAttribute('href', iconHref)
          iconLinks[iconIndex].setAttribute('type', iconSize ? 'image/png' : 'image/x-icon')
        }
        if (!publicRoute) {
          // Opt the ADMIN shell out of machine translation (Sep 22 2026).
          // Chrome's built-in translator rewrites and re-parents text nodes
          // that React still believes it owns; React's next commit then calls
          // removeChild on a node that moved and throws "Failed to execute
          // 'removeChild' on 'Node'". Sentry BUSINESS-OS-1A caught exactly
          // that on POS while Chrome was translating the Khmer till into
          // English ("Turn", "Clean the basket", "End of sale"), and it
          // crashed the page AFTER the sale had already been recorded on the
          // Worker -- so the till came back with the order still open and its
          // amber recovery banner refusing further items. The admin app is
          // already fully bilingual through its own language switch, so no
          // staff member needs a machine translation of it.
          //
          // Both signals, on purpose: the meta is what Chrome/Edge read to
          // suppress the offer entirely, translate="no" is the HTML standard
          // attribute other engines honour. Storefront routes must stay
          // translatable -- a customer may still run the browser's page
          // translator on the storefront, which carries its own guard and
          // reload recovery for this crash class
          // (src/components/catalog/portalTranslateDomGuard.ts,
          // src/app/publicErrorRecovery.ts).
          var adminNoTranslate = document.createElement('meta')
          adminNoTranslate.setAttribute('name', 'google')
          adminNoTranslate.setAttribute('content', 'notranslate')
          document.head.appendChild(adminNoTranslate)
          document.documentElement.setAttribute('translate', 'no')
          var adminViewport = document.querySelector('meta[name="viewport"]')
          if (adminViewport) adminViewport.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover')
        }
      }())

      // Decide the theme BEFORE the loading-shell stylesheet below is applied.
      //
      // The shell used to paint itself from `prefers-color-scheme: dark`,
      // while public/theme-bootstrap.js -- which only loads at the bottom of
      // <body> -- forces light unless the device stored 'dark'. On a dark-mode
      // iPhone that is a guaranteed dark flash on every cold start, and it
      // contradicts the owner's light-first rule ("the storefront and admin
      // default to LIGHT on first load and never auto-honour OS dark").
      //
      // Same three storage keys, same precedence, same 'light' default as
      // src/public-runtime/theme-bootstrap.ts (generated into
      // public/theme-bootstrap.js) and AppContext, so a device that stored a
      // theme under the OLD key still gets exactly the theme it had:
      //   1. businessos_device_settings  JSON, .theme        (current)
      //   2. businessos_theme            raw string          (older)
      //   3. businessos_settings         JSON, .theme        (legacy)
      // Only the literal 'dark' means dark; anything else, including a missing
      // value and the OS preference, means light. tests/iosLayoutGuards.test.ts
      // locks these key names and this order against theme-bootstrap.ts.
      ;(function setInitialBusinessOsTheme() {
        function isDark(value) {
          return String(value == null ? '' : value).trim().toLowerCase() === 'dark'
        }
        function storedObjectTheme(key) {
          try {
            var parsed = JSON.parse(localStorage.getItem(key) || '')
            return parsed && typeof parsed === 'object' ? parsed.theme : ''
          } catch (parseError) { return '' }
        }
        var dark = false
        try {
          dark = isDark(storedObjectTheme('businessos_device_settings'))
            || isDark(localStorage.getItem('businessos_theme'))
            || isDark(storedObjectTheme('businessos_settings'))
        } catch (storageError) { /* private mode / blocked storage: stay light */ }
        // The same two effects theme-bootstrap.js applies, just early enough
        // to beat first paint. theme-bootstrap.js re-applies them verbatim, so
        // it stays the single authority and this can only ever agree with it.
        // Wrapped like the redirect above: nothing in a pre-paint script may
        // throw, and the DOM doubles the startup tests run this file in
        // (tests/brandIcons.test.ts) have no classList on documentElement.
        try {
          var root = document.documentElement
          if (root.classList) {
            if (dark) root.classList.add('dark')
            else root.classList.remove('dark')
          }
          if (root.style) root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (themeApplyError) { /* fall through to the light shell */ }
      }())
    </script>
    <style data-business-os-initial-shell>
      :root {
        /* light, not `light dark`: the app is light-first and never auto-
           honours the OS preference. The script above adds `dark` to <html>
           when -- and only when -- the device actually stored that choice. */
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #f5f7fb;
      }
      .business-os-initial-shell {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        pointer-events: none;
      }
      .business-os-initial-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: calc(100vw - 32px);
        text-align: center;
      }
      .business-os-initial-spinner {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: 3px solid rgba(37, 99, 235, 0.18);
        border-top-color: #2563eb;
        animation: business-os-spin 0.8s linear infinite;
      }
      @keyframes business-os-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .business-os-initial-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      [data-business-os-initial-route="admin"] [data-business-os-public],
      [data-business-os-initial-route="public"] [data-business-os-admin] {
        display: none !important;
      }
      .business-os-initial-title {
        margin: 0;
        font-size: 14px;
        line-height: 1.2;
        font-weight: 800;
      }
      .business-os-initial-copy {
        margin: 0;
        color: #64748b;
        font-size: 11px;
        line-height: 1.3;
      }
      /* Keyed on the stored choice the script above applied, NOT on
         `prefers-color-scheme: dark`. The old media query painted this shell
         dark for every dark-mode iPhone and then theme-bootstrap.js forced
         light a moment later -- a dark flash on every cold start of an app
         that is light-first by decision. `.dark` (0-1-0) is declared after
         `:root`/`body` (0-1-0 / 0-0-1), so it wins on source order. */
      .dark {
        color-scheme: dark;
      }
      .dark,
      .dark body {
        background: #101827;
        color: #e5edf7;
      }
      .dark .business-os-initial-copy {
        color: #a7b4c6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="business-os-initial-shell" role="status" aria-live="polite">
        <div class="business-os-initial-panel">
          <div class="business-os-initial-spinner" aria-hidden="true"></div>
          <div class="business-os-initial-brand">
            <h1 class="business-os-initial-title">
              <span data-business-os-admin data-business-os-identity="adminTitle">Business OS Admin</span>
              <span data-business-os-public data-business-os-identity="shopName">Business OS</span>
            </h1>
            <p class="business-os-initial-copy">
              <span data-business-os-admin>Opening workspace</span>
              <span data-business-os-public>Opening catalog</span>
            </p>
          </div>
        </div>
      </div>
    </div>
    <script src="/runtime-noise-guard.js"></script>
    <script src="/theme-bootstrap.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
