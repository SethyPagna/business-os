<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Keep the app at the device width on iOS. The image lightbox has its
         own explicit zoom controls; browser pinch-zoom otherwise scales the
         whole UI and pushes action rows outside the viewport.

         maximum-scale/user-scalable are belt and braces, NOT the primary
         defence against focus-zoom: Safari has ignored user-scalable on the
         open web since iOS 10 and honours it only in an installed home-screen
         PWA. The mechanism that actually stops a tapped field from zooming
         the page is the 16px font-size floor at the end of
         src/styles/main.css -- keep that rule, not this attribute, in mind
         when a field starts zooming again. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="Leang Beauty — product catalog, prices and store contact" />
    <!-- Canonical URL and link previews (Open Graph / Twitter card) for the
         storefront. All three absolute values name the PRIMARY host, for two
         reasons: crawlers do not resolve relative URLs, and the alias host
         leangcosmetics.dpdns.org serves this very same document -- an absolute
         canonical is what folds the alias into leangbeauty.com without any
         per-host work at all.

         The storefront's indexable URLs are the home page and the three
         query-addressed legal readers (?legal=privacy|terms|cookies, which the
         sitemap lists). Those readers are VIEWS of this one document -- the
         raw HTML a crawler receives is byte-identical -- so they share its
         canonical. If a policy ever becomes its own document, the canonical
         has to become per-URL, and that means a Worker rewrite.

         On admin hosts the Worker replaces canonical and og:* along with the
         title and icons (cloudflare/src/lib/adminDocumentIdentity.ts). It
         replaces them with RELATIVE values on purpose: nothing should ever
         preview or index the admin app, and the point there is only that it is
         not Leang Beauty. The inline bootstrap below leaves all of these
         alone. -->
    <link rel="canonical" href="https://leangbeauty.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Leang Beauty" />
    <meta property="og:title" content="Leang Beauty" />
    <meta property="og:description" content="Leang Beauty — product catalog, prices and store contact" />
    <meta property="og:url" content="https://leangbeauty.com/" />
    <meta property="og:image" content="https://leangbeauty.com/leang-cosmetics-icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, not `black-translucent`. black-translucent paints the iOS
         status bar text WHITE and lets the page run underneath it, which only
         works over dark top chrome. Both hosts are near-white in the
         light-first default this app ships: the storefront ground is #ffffff
         (src/components/catalog/portalContrast.ts:46 PORTAL_LIGHT_SURFACE) and
         the admin's mobile top bar is the ivory --nav-surface #fffdf8
         (src/components/navigation/nav-chrome.css:48 and .bos-nav-topbar at
         :104) -- NOT the #1e3a8a the theme-color meta above advertises. So on
         an iPhone the clock and battery were white on white on both. This is
         deliberately one static value rather than a per-host swap in the
         script below: both hosts want the same answer, and a branch that sets
         the same string twice is dead code. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Leang Beauty" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Public-first metadata is intentional. iOS may snapshot the raw HTML
         before JavaScript runs, so the customer domain must never initially
         advertise the internal Business OS app. The synchronous bootstrap
         below swaps these to the admin assets on admin.* / localhost. -->
    <link rel="manifest" href="/portal-manifest.json" />
    <link rel="icon" type="image/png" href="/leang-cosmetics-icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/leang-cosmetics-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/leang-cosmetics-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/leang-cosmetics-apple-touch-icon-v1.png" />
    <title>Leang Beauty</title>
    <script>
      (function setInitialBusinessOsRoute() {
        var pathname = String(window.location && window.location.pathname || '/')
          .split('?')[0]
          .split('#')[0]
          .replace(/\/{2,}/g, '/')
          .replace(/\/+$/g, '')
          .toLowerCase() || '/'
        var adminRoutes = {
          '/': true,
          '/admin': true,
          '/app': true,
          '/login': true,
          '/dashboard': true,
          '/products': true,
          '/product': true,
          '/pos': true,
          '/point-of-sale': true,
          '/inventory': true,
          '/sales': true,
          '/returns': true,
          '/branches': true,
          '/contacts': true,
          '/catalog': true,
          '/loyalty-points': true,
          '/loyalty': true,
          '/users': true,
          '/audit-log': true,
          '/audit': true,
          '/receipt-settings': true,
          '/receipts': true,
          '/backup': true,
          '/backups': true,
          '/settings': true,
          '/files': true,
          '/library': true,
          '/server': true
        }
        var hostname = String(window.location && window.location.hostname || '').toLowerCase()
        // Old-domain VISITS redirect to leangbeauty.com (Aug 28 2026). Only
        // page navigations go through this bootstrap -- API/upload fetches
        // never load index.html -- so existing integrations keep working
        // while people (and bookmarks/PWA opens) land on the new domain
        // with their path and query preserved. try/catch keeps the test
        // DOM doubles (no location.replace) and any exotic browser on the
        // normal render path instead of a blank page.
        var redirectHosts = {
          'leangcosmetics.dpdns.org': 'leangbeauty.com',
          'admin.leangcosmetics.dpdns.org': 'admin.leangbeauty.com',
          'leangcosmetics.com': 'leangbeauty.com',
          'www.leangcosmetics.com': 'leangbeauty.com',
          'admin.leangcosmetics.com': 'admin.leangbeauty.com',
          'www.leangbeauty.com': 'leangbeauty.com'
        }
        if (redirectHosts[hostname]) {
          try {
            window.location.replace('https://' + redirectHosts[hostname] + window.location.pathname + window.location.search + window.location.hash)
          } catch (redirectError) { /* fall through to normal render */ }
        }
        var adminHostname = hostname === 'localhost'
          || hostname === '127.0.0.1'
          || hostname === '::1'
          || hostname.indexOf('admin.') === 0
        var segment = '/' + (pathname.split('/').filter(Boolean)[0] || '')
        var publicRoute = pathname === '/'
          ? !adminHostname
          : pathname !== '/health'
            && pathname.indexOf('/api/') !== 0
            && pathname.indexOf('/uploads/') !== 0
            && !/\.[a-z0-9]+$/i.test(pathname)
            && !adminRoutes[segment]
        document.documentElement.setAttribute('data-business-os-initial-route', publicRoute ? 'public' : 'admin')
        if (publicRoute) {
          document.title = 'Leang Beauty'
          var description = document.querySelector('meta[name="description"]')
          if (description) description.setAttribute('content', 'Leang Beauty — product catalog, prices and store contact')
          var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]')
          if (appTitle) appTitle.setAttribute('content', 'Leang Beauty')
          var manifest = document.querySelector('link[rel="manifest"]')
          if (manifest) manifest.setAttribute('href', '/portal-manifest.json')
          var icons = document.querySelectorAll('link[rel="icon"]')
          for (var iconIndex = 0; iconIndex < icons.length; iconIndex += 1) {
            icons[iconIndex].setAttribute('href', '/leang-cosmetics-icon-512.png')
            icons[iconIndex].setAttribute('type', 'image/png')
          }
          var appleIcon = document.querySelector('link[rel="apple-touch-icon"]')
          if (appleIcon) appleIcon.setAttribute('href', '/leang-cosmetics-apple-touch-icon-v1.png')
        } else {
          // The static <title>/apple-title default to the storefront brand so
          // iOS "Add to Home Screen" -- which can snapshot the raw HTML title
          // before this script's public branch runs -- never labels the
          // customer storefront "Business OS". The admin shell keeps the
          // internal platform name; reset it here, the same synchronous
          // pre-paint mechanism the storefront relies on above. Icons and the
          // manifest stay on their admin static defaults, so only the text
          // needs resetting.
          document.title = 'Business OS'
          var adminAppTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]')
          if (adminAppTitle) adminAppTitle.setAttribute('content', 'Business OS')
          var adminDescription = document.querySelector('meta[name="description"]')
          if (adminDescription) adminDescription.setAttribute('content', 'Business OS - Offline-first POS, inventory and analytics')
          var adminManifest = document.querySelector('link[rel="manifest"]')
          if (adminManifest) adminManifest.setAttribute('href', '/manifest.json')
          var adminIcons = document.querySelectorAll('link[rel="icon"]')
          for (var adminIconIndex = 0; adminIconIndex < adminIcons.length; adminIconIndex += 1) {
            var adminIconSize = adminIcons[adminIconIndex].getAttribute('sizes')
            adminIcons[adminIconIndex].setAttribute('href', adminIconSize === '192x192' ? '/icon-192.png' : (adminIconSize === '512x512' ? '/icon-512.png' : '/favicon.ico?v=business-os'))
            adminIcons[adminIconIndex].setAttribute('type', adminIconSize ? 'image/png' : 'image/x-icon')
          }
          var adminAppleIcon = document.querySelector('link[rel="apple-touch-icon"]')
          if (adminAppleIcon) adminAppleIcon.setAttribute('href', '/apple-touch-icon.png')
        }
      }())

      // Decide the theme BEFORE the loading-shell stylesheet below is applied.
      //
      // The shell used to paint itself from `prefers-color-scheme: dark`,
      // while public/theme-bootstrap.js -- which only loads at the bottom of
      // <body> -- forces light unless the device stored 'dark'. On a dark-mode
      // iPhone that is a guaranteed dark flash on every cold start, and it
      // contradicts the owner's light-first rule ("the storefront and admin
      // default to LIGHT on first load and never auto-honour OS dark").
      //
      // Same three storage keys, same precedence, same 'light' default as
      // src/public-runtime/theme-bootstrap.ts (generated into
      // public/theme-bootstrap.js) and AppContext, so a device that stored a
      // theme under the OLD key still gets exactly the theme it had:
      //   1. businessos_device_settings  JSON, .theme        (current)
      //   2. businessos_theme            raw string          (older)
      //   3. businessos_settings         JSON, .theme        (legacy)
      // Only the literal 'dark' means dark; anything else, including a missing
      // value and the OS preference, means light. tests/iosLayoutGuards.test.ts
      // locks these key names and this order against theme-bootstrap.ts.
      ;(function setInitialBusinessOsTheme() {
        function isDark(value) {
          return String(value == null ? '' : value).trim().toLowerCase() === 'dark'
        }
        function storedObjectTheme(key) {
          try {
            var parsed = JSON.parse(localStorage.getItem(key) || '')
            return parsed && typeof parsed === 'object' ? parsed.theme : ''
          } catch (parseError) { return '' }
        }
        var dark = false
        try {
          dark = isDark(storedObjectTheme('businessos_device_settings'))
            || isDark(localStorage.getItem('businessos_theme'))
            || isDark(storedObjectTheme('businessos_settings'))
        } catch (storageError) { /* private mode / blocked storage: stay light */ }
        // The same two effects theme-bootstrap.js applies, just early enough
        // to beat first paint. theme-bootstrap.js re-applies them verbatim, so
        // it stays the single authority and this can only ever agree with it.
        // Wrapped like the redirect above: nothing in a pre-paint script may
        // throw, and the DOM doubles the startup tests run this file in
        // (tests/brandIcons.test.ts) have no classList on documentElement.
        try {
          var root = document.documentElement
          if (root.classList) {
            if (dark) root.classList.add('dark')
            else root.classList.remove('dark')
          }
          if (root.style) root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (themeApplyError) { /* fall through to the light shell */ }
      }())
    </script>
    <style data-business-os-initial-shell>
      :root {
        /* light, not `light dark`: the app is light-first and never auto-
           honours the OS preference. The script above adds `dark` to <html>
           when -- and only when -- the device actually stored that choice. */
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #f5f7fb;
      }
      .business-os-initial-shell {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        pointer-events: none;
      }
      .business-os-initial-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: calc(100vw - 32px);
        text-align: center;
      }
      .business-os-initial-spinner {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: 3px solid rgba(37, 99, 235, 0.18);
        border-top-color: #2563eb;
        animation: business-os-spin 0.8s linear infinite;
      }
      @keyframes business-os-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .business-os-initial-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      [data-business-os-initial-route="admin"] [data-business-os-public],
      [data-business-os-initial-route="public"] [data-business-os-admin] {
        display: none !important;
      }
      .business-os-initial-title {
        margin: 0;
        font-size: 14px;
        line-height: 1.2;
        font-weight: 800;
      }
      .business-os-initial-copy {
        margin: 0;
        color: #64748b;
        font-size: 11px;
        line-height: 1.3;
      }
      /* Keyed on the stored choice the script above applied, NOT on
         `prefers-color-scheme: dark`. The old media query painted this shell
         dark for every dark-mode iPhone and then theme-bootstrap.js forced
         light a moment later -- a dark flash on every cold start of an app
         that is light-first by decision. `.dark` (0-1-0) is declared after
         `:root`/`body` (0-1-0 / 0-0-1), so it wins on source order. */
      .dark {
        color-scheme: dark;
      }
      .dark,
      .dark body {
        background: #101827;
        color: #e5edf7;
      }
      .dark .business-os-initial-copy {
        color: #a7b4c6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="business-os-initial-shell" role="status" aria-live="polite">
        <div class="business-os-initial-panel">
          <div class="business-os-initial-spinner" aria-hidden="true"></div>
          <div class="business-os-initial-brand">
            <h1 class="business-os-initial-title">
              <span data-business-os-admin>Business OS</span>
              <span data-business-os-public>Leang Beauty</span>
            </h1>
            <p class="business-os-initial-copy">
              <span data-business-os-admin>Opening workspace</span>
              <span data-business-os-public>Opening catalog</span>
            </p>
          </div>
        </div>
      </div>
    </div>
    <script src="/runtime-noise-guard.js"></script>
    <script src="/theme-bootstrap.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
