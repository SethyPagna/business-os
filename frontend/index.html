<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="Business OS - Offline-first POS, inventory and analytics" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=business-os" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Business OS</title>
    <script>
      (function setInitialBusinessOsRoute() {
        var pathname = String(window.location && window.location.pathname || '/')
          .split('?')[0]
          .split('#')[0]
          .replace(/\/{2,}/g, '/')
          .replace(/\/+$/g, '')
          .toLowerCase() || '/'
        var adminRoutes = {
          '/': true,
          '/admin': true,
          '/app': true,
          '/login': true,
          '/dashboard': true,
          '/products': true,
          '/product': true,
          '/pos': true,
          '/point-of-sale': true,
          '/inventory': true,
          '/sales': true,
          '/returns': true,
          '/branches': true,
          '/contacts': true,
          '/catalog': true,
          '/loyalty-points': true,
          '/loyalty': true,
          '/users': true,
          '/audit-log': true,
          '/audit': true,
          '/receipt-settings': true,
          '/receipts': true,
          '/backup': true,
          '/backups': true,
          '/settings': true,
          '/files': true,
          '/library': true,
          '/server': true
        }
        var segment = '/' + (pathname.split('/').filter(Boolean)[0] || '')
        var publicRoute = pathname !== '/'
          && pathname !== '/health'
          && pathname.indexOf('/api/') !== 0
          && pathname.indexOf('/uploads/') !== 0
          && !/\.[a-z0-9]+$/i.test(pathname)
          && !adminRoutes[segment]
        document.documentElement.setAttribute('data-business-os-initial-route', publicRoute ? 'public' : 'admin')
      }())
    </script>
    <style data-business-os-initial-shell>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #f5f7fb;
      }
      .business-os-initial-shell {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1;
        display: flex;
        align-items: center;
        box-sizing: border-box;
        pointer-events: none;
      }
      .business-os-initial-panel {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100vw - 24px);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        padding: 6px 10px 6px 6px;
        backdrop-filter: blur(10px);
      }
      .business-os-initial-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .business-os-initial-mark {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: #2563eb;
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0;
      }
      [data-business-os-initial-route="admin"] [data-business-os-public],
      [data-business-os-initial-route="public"] [data-business-os-admin] {
        display: none !important;
      }
      .business-os-initial-title {
        margin: 0;
        font-size: 13px;
        line-height: 1.1;
        font-weight: 800;
      }
      .business-os-initial-copy {
        margin: 1px 0 0;
        color: #64748b;
        font-size: 11px;
        line-height: 1.2;
      }
      @media (prefers-color-scheme: dark) {
        :root,
        body {
          background: #101827;
          color: #e5edf7;
        }
        .business-os-initial-panel {
          background: rgba(17, 24, 39, 0.94);
          border-color: rgba(148, 163, 184, 0.22);
          box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
        }
        .business-os-initial-copy {
          color: #a7b4c6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="business-os-initial-shell" role="status" aria-live="polite">
        <div class="business-os-initial-panel">
          <div class="business-os-initial-brand">
            <div class="business-os-initial-mark">
              <span data-business-os-admin>OS</span>
              <span data-business-os-public>LE</span>
            </div>
            <div>
              <h1 class="business-os-initial-title">
                <span data-business-os-admin>Business OS</span>
                <span data-business-os-public>Leang Cosmetic</span>
              </h1>
              <p class="business-os-initial-copy">
                <span data-business-os-admin>Opening workspace</span>
                <span data-business-os-public>Opening catalog</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function syncInitialShellWithRoute() {
        var pathname = String(window.location && window.location.pathname || '/')
          .split('?')[0]
          .split('#')[0]
          .replace(/\/{2,}/g, '/')
          .replace(/\/+$/g, '')
          .toLowerCase() || '/'
        var adminRoutes = {
          '/': true,
          '/admin': true,
          '/app': true,
          '/login': true,
          '/dashboard': true,
          '/products': true,
          '/product': true,
          '/pos': true,
          '/point-of-sale': true,
          '/inventory': true,
          '/sales': true,
          '/returns': true,
          '/branches': true,
          '/contacts': true,
          '/catalog': true,
          '/loyalty-points': true,
          '/loyalty': true,
          '/users': true,
          '/audit-log': true,
          '/audit': true,
          '/receipt-settings': true,
          '/receipts': true,
          '/backup': true,
          '/backups': true,
          '/settings': true,
          '/files': true,
          '/library': true,
          '/server': true
        }
        var segment = '/' + (pathname.split('/').filter(Boolean)[0] || '')
        var publicRoute = pathname !== '/'
          && pathname !== '/health'
          && pathname.indexOf('/api/') !== 0
          && pathname.indexOf('/uploads/') !== 0
          && !/\.[a-z0-9]+$/i.test(pathname)
          && !adminRoutes[segment]
        if (!publicRoute) return
        var mark = document.querySelector('.business-os-initial-mark')
        var title = document.querySelector('.business-os-initial-title')
        var copy = document.querySelector('.business-os-initial-copy')
        if (mark) mark.textContent = 'LE'
        if (title) title.textContent = 'Leang Cosmetic'
        if (copy) copy.textContent = 'Opening catalog'
      }())
    </script>
    <script src="/runtime-noise-guard.js"></script>
    <script src="/theme-bootstrap.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
